<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" width="1120" height="260" role="img" aria-label="Alur deploy Shoal Deploy">
  <style>
    .bg { fill: #08080a; }
    .node { fill: #0d0d10; stroke: #26262c; stroke-width: 1; }
    .node.on { stroke: #4d6a12; }
    .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .12em; fill: #85858f; }
    .val { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #e9e9ee; }
    .dim { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #7d7d88; letter-spacing: .08em; }
    .volt { fill: #bdfe0a; }
    .link { stroke: #24242a; stroke-width: 1.4; fill: none; }
    .flow { stroke: #bdfe0a; stroke-width: 1.6; fill: none; stroke-dasharray: 6 10; opacity: .9; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -32; } }
    .glow { animation: glow 4.8s ease-in-out infinite; }
    .g2 { animation: glow 4.8s ease-in-out 1.2s infinite; }
    .g3 { animation: glow 4.8s ease-in-out 2.4s infinite; }
    .g4 { animation: glow 4.8s ease-in-out 3.6s infinite; }
    @keyframes glow {
      0%, 70%, 100% { opacity: .25; }
      12%, 58% { opacity: 1; }
    }
    .caret { animation: caret 1.1s steps(1) infinite; }
    @keyframes caret { 50% { opacity: 0; } }
  </style>

  <rect class="bg" width="1120" height="260" rx="8"/>
  <rect x=".5" y=".5" width="1119" height="259" rx="8" fill="none" stroke="#1c1c21"/>

  <!-- nodes -->
  <g>
    <rect class="node" x="40" y="72" width="208" height="86" rx="6"/>
    <text class="lbl" x="60" y="100">1 · REPO</text>
    <text class="val" x="60" y="124">git clone --depth 1</text>
    <text class="dim" x="60" y="144">branch / tag</text>

    <rect class="node" x="312" y="72" width="208" height="86" rx="6"/>
    <text class="lbl" x="332" y="100">2 · BUILD</text>
    <text class="val" x="332" y="124">docker build</text>
    <text class="dim" x="332" y="144">log live di portal</text>

    <rect class="node" x="584" y="72" width="208" height="86" rx="6"/>
    <text class="lbl" x="604" y="100">3 · HEALTH</text>
    <text class="val" x="604" y="124">port acak, &lt; 500</text>
    <text class="dim" x="604" y="144">gagal = versi lama tetap</text>

    <rect class="node" x="856" y="72" width="208" height="86" rx="6"/>
    <text class="lbl" x="876" y="100">4 · ROUTE</text>
    <text class="val" x="876" y="124">caddy reload</text>
    <text class="dim" x="876" y="144">domain → HTTPS</text>
  </g>

  <!-- connectors -->
  <path class="link" d="M248 115 H304"/>
  <path class="link" d="M520 115 H576"/>
  <path class="link" d="M792 115 H848"/>
  <path class="flow" d="M248 115 H304"/>
  <path class="flow" d="M520 115 H576"/>
  <path class="flow" d="M792 115 H848"/>

  <!-- travelling packet: repo -> route -->
  <circle r="3.2" class="volt" opacity=".95">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"
                   path="M248 115 H304 L312 115 H520 H576 H584 H792 H848 H856"/>
  </circle>

  <!-- step ticks that light in sequence -->
  <g>
    <circle class="volt glow" cx="60" cy="150" r="0"/>
    <text class="dim g3" x="40" y="200">[ ok ] container lama disimpan untuk rollback</text>
    <text class="dim g2" x="40" y="222">[ ok ] tiga image terakhir disimpan</text>
    <text class="val" x="40" y="42">git &#8594; build &#8594; health &#8594; route<tspan class="volt caret"> _</tspan></text>
  </g>
</svg>
