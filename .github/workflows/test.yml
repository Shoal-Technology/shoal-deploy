name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o shoal-deploy .
      - name: binary is static
        run: |
          file shoal-deploy | grep -q 'statically linked'
          ls -l shoal-deploy
